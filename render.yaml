services:
  - type: web
    name: phantom-strike-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false

